services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zipcast
      POSTGRES_PASSWORD: zipcast-password
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipcast -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      DATABASE_URL: postgres://zipcast:zipcast-password@db:5432/avenuecode_production
      CACHE_DATABASE_URL: postgres://zipcast:zipcast-password@db:5432/avenuecode_production_cache
      QUEUE_DATABASE_URL: postgres://zipcast:zipcast-password@db:5432/avenuecode_production_queue
      CABLE_DATABASE_URL: postgres://zipcast:zipcast-password@db:5432/avenuecode_production_cable
    command: >
      /bin/bash -lc "
      bin/rails db:prepare &&
      ./bin/thrust ./bin/rails server
      "

volumes:
  postgres_data:
